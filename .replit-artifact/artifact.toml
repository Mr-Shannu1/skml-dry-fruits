kind = "web"
previewPath = "/"
title = "SKML Dry Fruits"
version = "1.0.0"
id = "artifacts/skml-dry-fruits"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20174

[services.development]
run = "pnpm --filter @workspace/skml-dry-fruits run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skml-dry-fruits", "run", "build" ]
publicDir = "artifacts/skml-dry-fruits/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20174"
BASE_PATH = "/"
